name: Build portable exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # FolderProfile publishes a single, self-contained Prosenter.exe into Prosenter/Prosenter/Release
      - name: Publish
        run: dotnet publish Prosenter/Prosenter/Prosenter.csproj -c Release -p:PublishProfile=FolderProfile

      - uses: actions/upload-artifact@v4
        with:
          name: Prosenter
          path: Prosenter/Prosenter/Release/Prosenter.exe
          if-no-files-found: error
