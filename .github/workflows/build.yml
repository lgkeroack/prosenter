name: Build portable exe

# Every merge to main builds Prosenter.exe and publishes it as a GitHub release
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # FolderProfile publishes a single, self-contained Prosenter.exe into Prosenter/Prosenter/Release
      - name: Publish
        run: dotnet publish Prosenter/Prosenter/Prosenter.csproj -c Release -p:PublishProfile=FolderProfile -p:Version=${{ env.VERSION }}

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ env.VERSION }}" Prosenter/Prosenter/Release/Prosenter.exe --target "${{ github.sha }}" --title "Prosenter ${{ env.VERSION }}" --notes "Download Prosenter.exe below and run it, nothing to install." --generate-notes --latest
